name: Deploy Firebase rules, indexes and functions
# App Hosting deploys the web app itself from the live branch (configured in the Firebase console).
# This workflow deploys the rest when the FIREBASE_SERVICE_ACCOUNT secret exists (DEPLOY.md, option A).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SA == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_SA == 'true'
        run: npm ci && npm --prefix functions ci
      - name: Write service account
        if: env.HAS_SA == 'true'
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Deploy
        if: env.HAS_SA == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx firebase deploy --only firestore,storage,functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force
      - name: Skip notice
        if: env.HAS_SA != 'true'
        run: echo "FIREBASE_SERVICE_ACCOUNT not configured; skipping deploy (see DEPLOY.md)."
