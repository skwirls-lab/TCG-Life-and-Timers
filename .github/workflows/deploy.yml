name: Deploy
# Every push to `main` builds the static export (public config from .env.production) and deploys
# it to Firebase Hosting together with the Firestore rules and indexes, the Storage rules and the
# Cloud Functions (DEPLOY.md Parts 4 and 5). Pull requests from this repository get a preview
# channel. Authentication is keyless Workload Identity Federation when the GCP_WIF_PROVIDER and
# GCP_SERVICE_ACCOUNT repository variables are set, or a FIREBASE_SERVICE_ACCOUNT JSON key secret
# (main only). With neither, the jobs skip.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed to mint the GitHub OIDC token for Workload Identity Federation

env:
  FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'tcgtempo' }}

jobs:
  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One production deploy at a time, in push order; never cancel one half-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      USE_WIF: ${{ vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Skip notice
        if: env.USE_WIF != 'true' && env.HAS_SA != 'true'
        run: echo "No deploy credentials configured; skipping deploy (see DEPLOY.md Part 5)."
      - uses: actions/checkout@v4
        if: env.USE_WIF == 'true' || env.HAS_SA == 'true'
      - uses: actions/setup-node@v4
        if: env.USE_WIF == 'true' || env.HAS_SA == 'true'
        with:
          node-version: 22
          cache: npm
      - if: env.USE_WIF == 'true' || env.HAS_SA == 'true'
        run: npm ci && npm --prefix functions ci
      - name: Build the static export (out/)
        if: env.USE_WIF == 'true' || env.HAS_SA == 'true'
        run: npm run build
      - name: Authenticate (Workload Identity Federation, keyless)
        if: env.USE_WIF == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Write service account key
        if: env.USE_WIF != 'true' && env.HAS_SA == 'true'
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Deploy (Hosting, rules, indexes, functions)
        if: env.USE_WIF == 'true' || env.HAS_SA == 'true'
        run: npx firebase deploy --only hosting,firestore,storage,functions --project "$FIREBASE_PROJECT_ID" --non-interactive --force
      - name: Summary
        if: env.USE_WIF == 'true' || env.HAS_SA == 'true'
        run: echo "Deployed to https://$FIREBASE_PROJECT_ID.web.app" >> "$GITHUB_STEP_SUMMARY"

  preview:
    # Same-repository pull requests only (forks get no OIDC token or variables), and only with WIF.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.GCP_WIF_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the static export (out/)
        run: npm run build
      - name: Authenticate (Workload Identity Federation, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Deploy to a preview channel (expires in 7 days)
        env:
          CHANNEL: pr-${{ github.event.pull_request.number }}
        run: |
          npx firebase hosting:channel:deploy "$CHANNEL" --expires 7d \
            --project "$FIREBASE_PROJECT_ID" --non-interactive --json > "$RUNNER_TEMP/channel.json"
          URL=$(node -e 'const r=require(process.argv[1]).result;console.log(Object.values(r).map(s=>s.url).join(" "))' "$RUNNER_TEMP/channel.json")
          echo "Preview: $URL"
          {
            echo "### Hosting preview"
            echo ""
            echo "$URL (channel \`$CHANNEL\`, expires in 7 days)"
            echo ""
            echo "Google sign-in is not expected to work on preview URLs (not an authorized domain)."
          } >> "$GITHUB_STEP_SUMMARY"
