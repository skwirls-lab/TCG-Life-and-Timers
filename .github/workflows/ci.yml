name: CI
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Static (G-STATIC)
        run: npm run typecheck && npm run lint && npm run format:check
      - name: Unit + coverage (G-UNIT)
        run: npm run test:unit -- --coverage
      - name: Presets (G-PRESETS)
        run: npm run check:presets
      - name: Trace (G-TRACE)
        run: npm run check:trace
      - name: Rules (G-RULES)
        run: npm run test:rules
      - name: Functions (G-FUNCS)
        run: npm run test:functions
      - name: Hosting config in sync with headers.ts
        run: npm run check:hosting
      - name: Static export + bundle (G-BUILD)
        # out/ with the production .env; the budget is measured on the exported HTML
        run: npm run build && npm run check:bundle
      - name: Install Playwright browsers (CI only)
        run: npx playwright install --with-deps chromium webkit
      # The e2e and Lighthouse runs serve the exports (out-test/, out-emu/, out/) with the Firebase
      # Hosting emulator and firebase.json's headers and rewrites (scripts/serve-hosting.ts).
      - name: E2E (G-E2E, includes real WebKit)
        run: npm run test:e2e
      - name: E2E with emulators (G-E2E-EMU)
        run: npm run test:e2e:emu
      - name: Lighthouse (G-LH)
        run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results
            playwright-report
